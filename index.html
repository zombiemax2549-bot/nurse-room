<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOXAME - Data Verification Portal</title>
    <style>
        /* ==========================================================================
           1. ส่วนของ CSS (แต่งหน้าตาเว็บให้เหมือนในรูปภาพเป๊ะๆ)
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* พื้นหลังไล่เฉดสีมืดสไตล์ดาร์กโหมด */
        body {
            background: radial-gradient(circle at 50% 50%, #111723 0%, #070a0f 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* กล่องโมเดลการ์ด NOXAME ตัวกลางหน้าจอ */
        .card {
            background: #17191e;
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 45px 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* ส่วนหัวข้อ Brand โลโก้ */
        .brand-zone {
            text-align: center;
            margin-bottom: 5px;
        }

        .brand-logo {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(45deg, #00d2ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .brand-sub {
            font-size: 11px;
            color: #475569;
            letter-spacing: 2px;
            margin-top: 6px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* ส่วนกล่องข้อความ Area Input */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        .input-label {
            color: #00d2ff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* ช่องสำหรับกรอกตัวเลข */
        .input-box {
            background: #0f1115;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 16px;
            color: #ffffff;
            font-size: 22px;
            letter-spacing: 3px;
            outline: none;
            transition: all 0.25s ease;
            font-weight: 500;
        }

        /* เอฟเฟกต์ตอนจิ้มกล่องพิม */
        .input-box:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.15);
        }

        /* ตัวนับจำนวนตัวอักษรมุมขวาล่างช่องพิม */
        .counter-zone {
            text-align: right;
            font-size: 12px;
            color: #00d2ff;
            margin-top: -2px;
            font-weight: bold;
        }

        /* ปุ่ม VERIFY DATA เรืองแสงสีฟ้า */
        .verify-btn {
            background: linear-gradient(90deg, #00d2ff, #00a8ff);
            border: none;
            padding: 16px;
            border-radius: 12px;
            color: #000000;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.35);
            margin-top: 5px;
            text-transform: uppercase;
        }

        .verify-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 25px rgba(0, 210, 255, 0.55);
        }

        .verify-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand-zone">
            <div class="brand-logo">NOXAME</div>
            <div class="brand-sub">Data Verification Portal</div>
        </div>

        <div class="input-group">
            <label class="input-label" for="studentId">เลขประจำตัวนักเรียน</label>
            <input type="text" id="studentId" class="input-box" maxlength="11" placeholder="•••••••••••" autocomplete="off">
            <div class="counter-zone" id="charCount">0/11</div>
        </div>

        <button id="verifyBtn" class="verify-btn">VERIFY DATA</button>
    </div>

    <script>
        const studentIdInput = document.getElementById('studentId');
        const charCountText = document.getElementById('charCount');
        const verifyBtn = document.getElementById('verifyBtn');

        // ระบบที่ 1: ดักจับตอนพิมพ์ (พิมพ์ได้เฉพาะตัวเลข 0-9 เท่านั้น และอัปเดตตัวนับตัวอักษรแบบ Real-time)
        studentIdInput.addEventListener('input', function() {
            // ล้างค่าดักเอาตัวอักษรภาษาไทย/อังกฤษ หรืออักขระพิเศษออกให้เหลือแค่ตัวเลข
            this.value = this.value.replace(/[^0-9]/g, '');
            
            // อัปเดตตัวเลขบอกสถานะ เช่น 5/11, 11/11
            let currentLength = this.value.length;
            charCountText.innerText = `${currentLength}/11`;
        });

        // ระบบที่ 2: ดักจับการกดปุ่ม VERIFY DATAเพื่อข้ามไปหน้าต่อไป
        verifyBtn.addEventListener('click', function() {
            let idValue = studentIdInput.value.trim();

            // เช็คเงื่อนไขว่าถ้ากรอกเลขอะไรก็ได้จนครบ 11 หลักเป๊ะๆ ให้ผ่านฉลุย
            if (idValue.length === 11) {
                // ตัวอย่าง: ถ้าหน้าถัดไปของมึงคือหน้าลงทะเบียนพยาบาล ให้เปลี่ยนตรงนี้เป็น 'nurse-registration.html' ได้เลยครับ
                window.location.href = 'nurse-registration.html'; 
            } else {
                // ถ้ากรอกไม่ครบ 11 ตัว จะมี Alert เตือนขึ้นมา
                alert('กรุณากรอกเลขประจำตัวให้ครบ 11 หลักก่อนนะเพื่อน!');
            }
        });
    </script>

</body>
</html>
