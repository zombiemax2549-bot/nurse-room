<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ห้องพยาบาล – วิทยาลัยเทคนิคหาดใหญ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Prompt:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --red:      #c0392b;
      --red-d:    #922b21;
      --red-l:    #fdecea;
      --accent:   #e74c3c;
      --green:    #1abc9c;
      --blue:     #3b82f6;
      --yellow:   #f59e0b;
      --bg:       #f4f1ee;
      --surface:  #ffffff;
      --surface2: #fafafa;
      --border:   #e5e7eb;
      --text:     #1a1a2e;
      --text2:    #6b7280;
      --shadow:   0 4px 24px rgba(192,57,43,0.10);
      --shadow2:  0 2px 8px rgba(0,0,0,0.08);
      --radius:   14px;
      --tr: 0.25s ease;
    }
    [data-theme="dark"] {
      --bg:       #0f0f18;
      --surface:  #1a1a2e;
      --surface2: #16213e;
      --border:   #2d2d4a;
      --text:     #f0f0f8;
      --text2:    #9ca3af;
      --shadow:   0 4px 24px rgba(0,0,0,0.4);
      --shadow2:  0 2px 8px rgba(0,0,0,0.3);
      --red-l:    #2d1a1a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family:'Sarabun',sans-serif; 
      background: var(--bg);
      /* 🛠️ แก้ไขพื้นหลัง: ใช้ Raw URL จาก GitHub เพื่อความชัวร์ */
      background-image: linear-gradient(rgba(244, 241, 238, 0.85), rgba(244, 241, 238, 0.85)), url('https://raw.githubusercontent.com/zombiemax2549-bot/nurse-room/main/image_11.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height:100vh; 
      color:var(--text); 
      transition:background var(--tr),color var(--tr); 
    }

    header {
      background:linear-gradient(135deg,var(--red-d) 0%,var(--red) 55%,#e74c3c 100%);
      color:#fff; padding:14px 28px;
      display:flex; align-items:center; gap:16px;
      box-shadow:0 3px 20px rgba(0,0,0,0.3);
      position:sticky; top:0; z-index:100;
    }
    .logo-circle { 
      width:52px; height:52px; background: #fff; border:2px solid rgba(255,255,255,0.4);
      border-radius:50%; display:flex; align-items:center; justify-content:center;
      overflow: hidden; flex-shrink:0; 
    }
    .logo-circle img {
      width: 90%; height: 90%; object-fit: contain;
    }
    header h1 { font-family:'Prompt',sans-serif;font-size:1.1rem;font-weight:700;line-height:1.3; }
    header p  { font-size:0.78rem;opacity:0.85;margin-top:1px; }
    #live-clock { font-size:0.7rem;opacity:0.75;margin-top:2px;font-family:'Prompt',sans-serif; }
    .header-right { margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0; }
    .header-badge { background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.35);border-radius:20px;padding:4px 12px;font-size:0.75rem;white-space:nowrap; }
    .sync-pill { display:flex;align-items:center;gap:5px;font-size:0.72rem;background:rgba(0,0,0,0.2);border-radius:20px;padding:4px 10px; }
    .dot { width:7px;height:7px;border-radius:50%;background:#aaa;flex-shrink:0; }
    .dot.online  { background:#2ecc71;animation:pulse 2s infinite; }
    .dot.offline { background:#e74c3c; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
    .btn-theme { background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.3);border-radius:8px;color:#fff;padding:6px 10px;cursor:pointer;font-size:1rem;transition:background 0.2s; }
    .btn-theme:hover { background:rgba(255,255,255,0.28); }

    .tab-nav { display:flex;gap:0;background:var(--surface);border-bottom:2px solid var(--border);padding:0 28px;overflow-x:auto;transition:background var(--tr); }
    .tab-btn { padding:12px 20px;border:none;background:none;font-family:'Sarabun',sans-serif;font-size:0.88rem;font-weight:600;color:var(--text2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color 0.2s,border-color 0.2s;display:flex;align-items:center;gap:6px; }
    .tab-btn.active { color:var(--red);border-bottom-color:var(--red); }
    .tab-btn:hover:not(.active) { color:var(--text); }

    .tab-content { display:none;padding:24px 28px 60px;max-width:1300px;margin:0 auto; }
    .tab-content.active { display:block; }

    .card { background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:background var(--tr); }
    .card-header { background:linear-gradient(135deg,var(--red) 0%,var(--red-d) 100%);color:#fff;padding:14px 20px;font-family:'Prompt',sans-serif;font-size:0.92rem;font-weight:600;display:flex;align-items:center;gap:8px; }
    .card-body { padding:20px; }

    .grid2 { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
    .form-group { margin-bottom:14px; position: relative; }
    label.lbl { display:block;font-size:0.82rem;font-weight:600;color:var(--text2);margin-bottom:4px; }
    label.lbl .req { color:var(--red); }
    input, select, textarea { width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:'Sarabun',sans-serif;font-size:0.88rem;color:var(--text);background:var(--surface2);transition:border-color 0.2s,box-shadow 0.2s,background var(--tr);outline:none; }
    input:focus, select:focus, textarea:focus { border-color:var(--red);box-shadow:0 0 0 3px rgba(192,57,43,0.12);background:var(--surface); }
    textarea { resize:vertical;min-height:76px; }

    .id-counter { font-size: 0.75rem; color: var(--text2); font-weight: bold; margin-top: 4px; display: block; text-align: right; }
    .id-counter.complete { color: var(--green); }

    .severity-btn { display:none; }
    .severity-group { display:flex;gap:8px;flex-wrap:wrap;margin-top:4px; }
    .severity-label { padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);font-size:0.8rem;cursor:pointer;transition:all 0.2s;font-weight:500;color:var(--text); }
    #sev-low:checked  ~ .severity-group .lbl-low  { background:#d1fae5;border-color:#10b981;color:#065f46; }
    #sev-mid:checked  ~ .severity-group .lbl-mid  { background:#fef3c7;border-color:#f59e0b;color:#78350f; }
    #sev-high:checked ~ .severity-group .lbl-high { background:#fee2e2;border-color:#ef4444;color:#991b1b; }

    .btn-submit { width:100%;padding:13px;background:linear-gradient(135deg,var(--red) 0%,var(--red-d) 100%);color:#fff;border:none;border-radius:10px;font-family:'Prompt',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity 0.2s,transform 0.15s;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(192,57,43,0.3); }
    .btn-submit:hover { opacity:0.9;transform:translateY(-1px); }
    .btn-submit:disabled { opacity:0.55;cursor:not-allowed;transform:none; }

    .stats-row { display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px; }
    .stat-box { background:var(--surface);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow2);display:flex;align-items:center;gap:14px;border-left:4px solid transparent;transition:transform 0.2s,box-shadow 0.2s,background var(--tr); }
    .stat-box:hover { transform:translateY(-2px);box-shadow:var(--shadow); }
    .stat-box.red   { border-color:var(--red); }
    .stat-box.blue  { border-color:var(--blue); }
    .stat-box.green { border-color:var(--green); }
    .stat-box.yel   { border-color:var(--yellow); }
    .stat-icon { font-size:1.9rem;line-height:1; }
    .stat-val { font-family:'Prompt',sans-serif;font-size:1.7rem;font-weight:800;line-height:1; }
    .stat-lbl { font-size:0.72rem;color:var(--text2);margin-top:3px; }

    .table-toolbar { display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap; }
    .search-box { flex:1;min-width:160px;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'Sarabun',sans-serif;font-size:0.86rem;color:var(--text);background:var(--surface2);outline:none; }
    .filter-select { padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;font-family:'Sarabun',sans-serif;font-size:0.86rem;color:var(--text);background:var(--surface2);cursor:pointer;outline:none; }
    .btn-export { padding:8px 14px;background:var(--green);color:#fff;border:none;border-radius:8px;font-family:'Sarabun',sans-serif;font-size:0.82rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:opacity 0.2s; }
    .btn-export:hover { opacity:0.85; }
    .btn-sound { padding:8px 12px;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:0.82rem;font-weight:600;transition:all 0.2s;color:var(--text);font-family:'Sarabun',sans-serif; }
    .btn-sound.on { background:#fef3c7;border-color:#f59e0b;color:#78350f; }

    table { width:100%;border-collapse:collapse; }
    thead { background:var(--red-l); }
    thead th { padding:10px 13px;text-align:left;font-size:0.75rem;font-weight:700;color:var(--red-d);text-transform:uppercase;letter-spacing:0.05em;border-bottom:2px solid var(--border);white-space:nowrap; }
    tbody tr { border-bottom:1px solid var(--border);transition:background 0.15s; }
    tbody td { padding:10px 13px;font-size:0.86rem;vertical-align:middle;color:var(--text); }

    .badge { display:inline-block;padding:3px 10px;border-radius:12px;font-size:0.7rem;font-weight:700; }
    .badge-low  { background:#d1fae5;color:#065f46; }
    .badge-mid  { background:#fef3c7;color:#78350f; }
    .badge-high { background:#fee2e2;color:#991b1b; }
    .badge-done { background:#dbeafe;color:#1d4ed8; }
    .badge-wait { background:#f3f4f6;color:#4b5563; }

    .action-btn { padding:4px 9px;border-radius:6px;border:1.5px solid var(--border);background:var(--surface);font-size:0.78rem;cursor:pointer;font-family:'Sarabun',sans-serif;transition:all 0.15s;margin-right:3px;color:var(--text); }

    /* Mobile Responsive */
    @media (max-width:1024px) { .stats-row { grid-template-columns:repeat(2,1fr); gap:10px; } }
    @media (max-width:768px) { 
      .tab-content { padding:16px 12px 48px; } 
      header { padding:12px 16px; gap:12px; flex-wrap: wrap; } 
      .header-right { width: 100%; justify-content: space-between; margin-top: 5px; }
    }
    @media (max-width:540px) { 
      .grid2 { grid-template-columns:1fr; gap: 0; } 
      table thead { display: none; }
      table, table tbody, table tr, table td { display: block; width: 100%; }
      table tr { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: var(--surface); }
      table td { text-align: right; border-bottom: 1px dashed var(--border); }
      table td::before { content: attr(data-label); float: left; font-weight: bold; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-circle">
    <img src="https://raw.githubusercontent.com/zombiemax2549-bot/nurse-room/main/image_10.png" alt="ตราวิทยาลัย">
  </div>
  <div>
    <h1>ห้องพยาบาล – วิทยาลัยเทคนิคหาดใหญ่</h1>
    <p>ระบบลงทะเบียนนักเรียนเข้ารับบริการ</p>
    <div id="live-clock"></div>
  </div>
  <div class="header-right">
    <div class="header-badge">📋 ปีการศึกษา 2567</div>
    <div class="sync-pill"><div class="dot" id="syncDot"></div><span id="syncText">กำลังเชื่อมต่อ...</span></div>
    <button class="btn-theme" id="themeBtn">🌙</button>
  </div>
</header>

<div class="tab-nav">
  <button class="tab-btn active" data-tab="tab-register">📝 ลงทะเบียน</button>
  <button class="tab-btn" data-tab="tab-list">📋 รายชื่อ</button>
  <button class="tab-btn" data-tab="tab-dash">📊 Dashboard</button>
</div>

<div class="tab-content active" id="tab-register">
  <div class="stats-row">
    <div class="stat-box red"><div class="stat-icon">👤</div><div><div class="stat-val" id="s-total">–</div><div class="stat-lbl">ทั้งหมดวันนี้</div></div></div>
    <div class="stat-box blue"><div class="stat-icon">⏳</div><div><div class="stat-val" id="s-wait">–</div><div class="stat-lbl">รอรับบริการ</div></div></div>
    <div class="stat-box green"><div class="stat-icon">✅</div><div><div class="stat-val" id="s-done">–</div><div class="stat-lbl">เสร็จสิ้น</div></div></div>
    <div class="stat-box yel"><div class="stat-icon">🔴</div><div><div class="stat-val" id="s-urg">–</div><div class="stat-lbl">เร่งด่วน</div></div></div>
  </div>
  <div class="card">
    <div class="card-header"><span>📝</span> กรอกข้อมูลการลงทะเบียน</div>
    <div class="card-body">
      <div class="form-group">
        <label class="lbl">เลขประจำตัวนักเรียน (11 หลัก) <span class="req">*</span></label>
        <input type="text" id="f-id" placeholder="เช่น 66309010001" maxlength="11" inputmode="numeric"/>
        <span class="id-counter" id="id-warn">0 / 11 หลัก</span>
      </div>
      <div class="grid2">
        <div class="form-group"><label class="lbl">ชื่อ <span class="req">*</span></label><input type="text" id="f-fname" placeholder="ชื่อ"/></div>
        <div class="form-group"><label class="lbl">นามสกุล <span class="req">*</span></label><input type="text" id="f-lname" placeholder="นามสกุล"/></div>
      </div>
      <div class="grid2">
        <div class="form-group">
          <label class="lbl">แผนก / สาขา <span class="req">*</span></label>
          <select id="f-dept"><option value="">-- เลือกแผนก --</option><option>ช่างยนต์</option><option>ช่างไฟฟ้า</option><option>ช่างอิเล็กทรอนิกส์</option><option>ช่างกลโรงงาน</option><option>ช่างเชื่อมโลหะ</option><option>เทคโนโลยีสารสนเทศ</option><option>การบัญชี</option><option>การตลาด</option><option>คอมพิวเตอร์ธุรกิจ</option><option>ช่างก่อสร้าง</option></select>
        </div>
        <div class="form-group">
          <label class="lbl">ระดับชั้น</label>
          <select id="f-level"><option value="">-- เลือก --</option><option>ปวช.1</option><option>ปวช.2</option><option>ปวช.3</option><option>ปวส.1</option><option>ปวส.2</option></select>
        </div>
      </div>
      <div class="form-group"><label class="lbl">อาการ / เหตุผลที่มา <span class="req">*</span></label><textarea id="f-symptom" placeholder="ระบุอาการเบื้องต้น..."></textarea></div>
      <div class="form-group">
        <label class="lbl">ระดับความเร่งด่วน</label>
        <input type="radio" name="sev" id="sev-low"  class="severity-btn" value="ไม่เร่งด่วน" checked/>
        <input type="radio" name="sev" id="sev-mid"  class="severity-btn" value="ปานกลาง"/>
        <input type="radio" name="sev" id="sev-high" class="severity-btn" value="เร่งด่วน"/>
        <div class="severity-group">
          <label for="sev-low"  class="severity-label lbl-low">🟢 ไม่เร่งด่วน</label>
          <label for="sev-mid"  class="severity-label lbl-mid">🟡 ปานกลาง</label>
          <label for="sev-high" class="severity-label lbl-high">🔴 เร่งด่วน</label>
        </div>
      </div>
      <button class="btn-submit" id="submitBtn">✅ บันทึกการลงทะเบียน</button>
    </div>
  </div>
</div>

<div class="tab-content" id="tab-list">
  <div class="card">
    <div class="table-toolbar">
      <input class="search-box" id="searchBox" placeholder="🔍 ค้นหาชื่อ / รหัส..."/>
      <select class="filter-select" id="filterDept"><option value="">ทุกแผนก</option></select>
      <button class="btn-theme" id="exportBtn" style="background:var(--green); border:none; padding:8px 15px;">📥 Export CSV</button>
    </div>
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>#</th><th>รหัส</th><th>ชื่อ–นามสกุล</th><th>แผนก</th><th>ชั้น</th><th>ความเร่งด่วน</th><th>เวลา</th><th>สถานะ</th><th>จัดการ</th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="tab-content" id="tab-dash">
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
    <div class="card" style="padding:20px;"><canvas id="chartDept"></canvas></div>
    <div class="card" style="padding:20px;"><canvas id="chartSev"></canvas></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, updateDoc, deleteDoc, doc, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const app = initializeApp({
    apiKey: "AIzaSyCl0DcZ-q6OIAw2KV58eVN-92Wad9FIVA4",
    authDomain: "llll-a2748.firebaseapp.com",
    projectId: "llll-a2748",
    storageBucket: "llll-a2748.firebasestorage.app",
    messagingSenderId: "692276230272",
    appId: "1:692276230272:web:f533c0e85762c630f90e65"
  });
  const db  = getFirestore(app);
  const col = collection(db, "nurse_records");

  setInterval(() => {
    document.getElementById('live-clock').textContent = new Date().toLocaleTimeString('th-TH');
  }, 1000);

  const fIdInput = document.getElementById('f-id');
  fIdInput.addEventListener('input', function() {
    this.value = this.value.replace(/[^0-9]/g, '');
    const currentLen = this.value.length;
    document.getElementById('id-warn').textContent = `${currentLen} / 11 หลัก`;
    document.getElementById('id-warn').style.color = currentLen === 11 ? 'var(--green)' : 'var(--text2)';
  });

  let records = [];
  onSnapshot(query(col), snap => {
    records = snap.docs.map(d => ({firestoreId: d.id, ...d.data()})).sort((a,b) => b.ts - a.ts);
    document.getElementById('syncDot').className = 'dot online';
    document.getElementById('syncText').textContent = '🔥 Real-time';
    renderTable();
    updateStats();
  });

  function updateStats() {
    document.getElementById('s-total').textContent = records.length;
    document.getElementById('s-wait').textContent = records.filter(r => r.status === 'รอรับบริการ').length;
    document.getElementById('s-done').textContent = records.filter(r => r.status === 'เสร็จสิ้น').length;
    document.getElementById('s-urg').textContent = records.filter(r => r.severity === 'เร่งด่วน').length;
  }

  window.renderTable = function() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = records.map((r, i) => `
      <tr>
        <td data-label="#">${i+1}</td>
        <td data-label="รหัส"><b>${r.sid||'–'}</b></td>
        <td data-label="ชื่อ">${r.name||'–'}</td>
        <td data-label="แผนก">${r.dept||'–'}</td>
        <td data-label="ชั้น">${r.lvl||'–'}</td>
        <td data-label="เร่งด่วน"><span class="badge ${r.severity==='เร่งด่วน'?'badge-high':'badge-low'}">${r.severity||'–'}</span></td>
        <td data-label="เวลา">${r.time||'–'}</td>
        <td data-label="สถานะ"><span class="badge ${r.status==='เสร็จสิ้น'?'badge-done':'badge-wait'}">${r.status||'–'}</span></td>
        <td>
          <button class="action-btn" onclick="markDone('${r.firestoreId}')">✅</button>
          <button class="action-btn" onclick="deleteRec('${r.firestoreId}')">🗑</button>
        </td>
      </tr>`).join('');
  };

  window.markDone = async fid => {
    await updateDoc(doc(db, 'nurse_records', fid), {status: 'เสร็จสิ้น'});
  };

  window.deleteRec = async fid => {
    if (confirm('ต้องการลบรายการนี้?')) await deleteDoc(doc(db, 'nurse_records', fid));
  };

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const sid = fIdInput.value;
    if (sid.length !== 11) return alert('กรุณากรอกเลขประจำตัวให้ครบ 11 หลัก');
    await addDoc(col, {
      sid, name: document.getElementById('f-fname').value + ' ' + document.getElementById('f-lname').value,
      dept: document.getElementById('f-dept').value, lvl: document.getElementById('f-level').value,
      symptom: document.getElementById('f-symptom').value, severity: document.querySelector('input[name="sev"]:checked').value,
      time: new Date().toLocaleTimeString('th-TH'), status: 'รอรับบริการ', ts: serverTimestamp()
    });
    alert('บันทึกสำเร็จ');
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn, .tab-content').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });
</script>
</body>
