<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOXAME - System Portal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* รีเซ็ต CSS พื้นฐาน */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
        }

        /* Responsive Body รองรับทุกขนาดหน้าจอ */
        body {
            background: radial-gradient(circle at center, #11131e 0%, #07080c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* แสงนีออนฟุ้งๆ ด้านหลัง (Glow Effects) */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            background: rgba(0, 242, 254, 0.12);
            top: 15%;
            left: 15%;
        }
        body::after {
            background: rgba(157, 0, 255, 0.12);
            bottom: 15%;
            right: 15%;
        }

        /* Container สไตล์ Glassmorphism (กระจกโปร่งแสงล้ำๆ) */
        .main-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 45px 35px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            text-align: center;
            z-index: 1;
            transition: all 0.3s ease;
        }

        /* หัวข้อระบบ (Cyberpunk Vibe) */
        .system-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #00f2fe 0%, #9d00ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 10px rgba(0, 242, 254, 0.2));
        }

        .system-subtitle {
            font-size: 0.85rem;
            color: #7e8c9f;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        /* Form Control */
        .form-group {
            position: relative;
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #00f2fe;
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* ช่องกรอกข้อมูลเน้นพิมพ์ง่ายบนมือถือ */
        .input-ctrl {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #ffffff;
            font-size: 1.2rem;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 3px;
            transition: all 0.25s ease;
        }

        .input-ctrl:focus {
            outline: none;
            border-color: #00f2fe;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
        }

        /* ส่วนแสดงสถานะตัวเลขด้านล่างกล่องอินพุต */
        .input-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 0.8rem;
        }

        .error-text {
            color: #ff4a6b;
            font-weight: 500;
            display: none; /* ซ่อนไว้ก่อน จะแสดงเมื่อกรอกไม่ครบ */
        }

        .counter-text {
            color: #64748b;
            margin-left: auto;
            font-family: 'Orbitron', sans-serif;
        }

        /* ปุ่มกดดีไซน์ลื่นไหล */
        .btn-action {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 14px;
            color: #060814;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.25);
            transition: all 0.25s ease;
            margin-top: 10px;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 242, 254, 0.45);
            filter: brightness(1.1);
        }

        .btn-action:active {
            transform: translateY(1px);
        }

        /* ==========================================
           MOBILE MODE (ปรับแต่งการแสดงผลบนโทรศัพท์มือถือ)
           ========================================== */
        @media (max-width: 480px) {
            body {
                padding: 15px;
                align-items: flex-start;
                padding-top: 60px; /* เว้นระยะด้านบนให้ดูไม่ติดขอบเกินไป */
            }

            .main-card {
                padding: 35px 20px;
                border-radius: 20px;
            }

            .system-title {
                font-size: 2.1rem;
                letter-spacing: 2px;
            }

            .input-ctrl {
                padding: 14px 16px;
                font-size: 1.1rem;
            }

            .btn-action {
                padding: 15px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="system-title">NOXAME</div>
        <div class="system-subtitle">Data Verification Portal</div>

        <form id="noxameForm" onsubmit="handleFormSubmit(event)">
            <div class="form-group">
                <label for="studentId">เลขประจำตัวนักเรียน</label>
                <input 
                    type="text" 
                    id="studentId" 
                    class="input-ctrl" 
                    placeholder="XXXXXXXXXXX"
                    inputmode="numeric" 
                    pattern="[0-9]{11}" 
                    maxlength="11" 
                    autocomplete="off"
                    oninput="validateAndCount(this)"
                    required
                >
                <div class="input-status">
                    <span id="errorAlert" class="error-text">❌ จำเป็นต้องกรอกให้ครบ 11 หลัก</span>
                    <span id="digitCounter" class="counter-text">0/11</span>
                </div>
            </div>

            <button type="submit" class="btn-action">VERIFY DATA</button>
        </form>
    </div>

    <script>
        // ฟังก์ชันควบคุมการพิมพ์: บังคับเฉพาะเลข 0-9 และคอยนับจำนวนตัวอักษร
        function validateAndCount(input) {
            // ดักจับและลบตัวอักษรหรือสัญลักษณ์ที่ไม่ใช่ตัวเลขออกทันที
            let cleanValue = input.value.replace(/[^0-9]/g, '');
            input.value = cleanValue;

            // อัปเดตตัวเลขบอกสถานะฝั่งขวา (เช่น 5/11)
            const counter = document.getElementById('digitCounter');
            counter.innerText = `${cleanValue.length}/11`;

            // จัดการสีและสถานะเตือนภัยแบบ Real-time
            const errorAlert = document.getElementById('errorAlert');
            if (cleanValue.length === 11) {
                errorAlert.style.display = 'none';
                counter.style.color = '#00f2fe';
                input.style.borderColor = 'rgba(255, 255, 255, 0.1)';
            } else {
                counter.style.color = '#64748b';
            }
        }

        // ฟังก์ชันเมื่อกดปุ่มยืนยัน (Submit)
        function handleFormSubmit(event) {
            event.preventDefault(); // ป้องกันการ reload หน้าจอเบื้องต้น
            
            const studentIdInput = document.getElementById('studentId');
            const errorAlert = document.getElementById('errorAlert');

            // ตรวจสอบขั้นสุดท้ายว่าครบ 11 หลักจริงไหม
            if (studentIdInput.value.length !== 11) {
                errorAlert.style.display = 'block';
                studentIdInput.style.borderColor = '#ff4a6b';
                studentIdInput.focus();
                return false;
            }

            // --- วาง LOGIC เดิมของคุณต่อตรงนี้ได้เลยครับ ---
            // ตัวอย่างเช่นการดึงข้อมูล หรือการเปลี่ยนหน้าเว็บไปหน้าแสดงผล:
            alert('กำลังประมวลผลเลขประจำตัว: ' + studentIdInput.value);
            
            // ตัวอย่างเปลี่ยนหน้าไปไฟล์อื่น:
            // window.location.href = "dashboard.html?id=" + studentIdInput.value;
        }
    </script>

</body>
</html>
